spring.application.name=linksnap

server.port=8081

# Database Connection (Injected via Environment Variables)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Hibernate / JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# HikariCP Pool settings tailored for Neon Free Tier
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000

# JWT Configuration
# Note: In JJWT 0.12.x, HMAC-SHA256 requires a secret key that is at least 256 bits (32 bytes / 64 hex/base64 chars long).
jwt.secret=NCtOYzUycjZVNmpYbjJyN3U1OHgveDQxP0QoRytLYjBQZFNnVmtiWXAwPQ==
jwt.expiration-ms=86400000